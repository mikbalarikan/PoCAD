# Geliştirme araçları yapılandırması. PoCAD kurulumu install.sh ile yapılır; bu dosya
# yalnızca testler (pytest) ve lint (ruff) içindir.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "cad: build123d/OpenCascade gerektiren testler (pip install -r requirements-cad.txt)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["bin/cad-chat.py", "bin/cad-reply"]
extend-exclude = ["examples"]  # agentcad model betikleri (show_object vb. enjekte edilir)

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E401", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"bin/cad-chat.py" = ["E501"]  # gömülü CSS/HTML dizeleri
"bin/cad-reply" = ["I001"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: shellcheck
        run: shellcheck -S warning install.sh bin/pocad bin/agentcad bin/cad-viewer scripts/*.sh

  test:
    name: Testler (CAD'siz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not cad"

  cad:
    name: Testler (build123d + OCP 7.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - run: pip install -r requirements-cad.txt
      - name: build123d içe aktarılabiliyor mu
        run: python -c "import build123d; print(build123d.__version__)"
      - run: pytest -m cad
